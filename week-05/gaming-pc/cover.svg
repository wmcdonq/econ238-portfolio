<text x="24" y="35" font-size="24" font-weight="bold">Eight unused hours each night</text><text x="24" y="63" font-size="16" fill="#555">One year; Dell Aurora R13 example; only the computer tower</text>
<line x1="168" y1="83" x2="168" y2="275" stroke="#ddd"/><text x="168" y="301" text-anchor="middle" font-size="15">0</text><line x1="291" y1="83" x2="291" y2="275" stroke="#ddd"/><text x="291" y="301" text-anchor="middle" font-size="15">25</text><line x1="414" y1="83" x2="414" y2="275" stroke="#ddd"/><text x="414" y="301" text-anchor="middle" font-size="15">50</text><line x1="537" y1="83" x2="537" y2="275" stroke="#ddd"/><text x="537" y="301" text-anchor="middle" font-size="15">75</text><line x1="660" y1="83" x2="660" y2="275" stroke="#ddd"/><text x="660" y="301" text-anchor="middle" font-size="15">100</text>
