<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img" aria-labelledby="title desc">
<title id="title">Eight unused hours each night</title><desc id="desc">One year; Dell Aurora R13 example; only the computer tower. Left on: 88.3 kWh; Sleep: 7.9 kWh; Shut down: 1.3 kWh. Calculated from Dell power figures. These are not measurements of my PC.</desc>
