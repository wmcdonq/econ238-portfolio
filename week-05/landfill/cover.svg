<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img" aria-labelledby="title desc">
<title id="title">How much ground would the waste cover?</title><desc id="desc">U.S. landfilled trash at the 2018 rate; no growth; 30 m average waste depth. 10 years: 64 km²; 50 years: 321 km²; 100 years: 642 km². Calculated from EPA waste and density data. Excludes land around the waste.</desc>
