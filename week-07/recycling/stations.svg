<svg xmlns="http://www.w3.org/2000/svg" width="720" height="212" viewBox="0 0 720 212" role="img" aria-labelledby="title desc"><title id="title">20 desks, two shared stations</title><desc id="desc">Proposed trial layout: replace collection at 20 desks with two shared stations. Each has separate bins for paper, containers, and trash. This is not a survey of an existing UR office.</desc><rect width="720" height="212" fill="#f0f4f6"/><g fill="#173b4d" font-family="Times New Roman,Times,serif"><text x="24" y="35" font-size="15" font-weight="bold">PROPOSED TRIAL LAYOUT</text><text x="24" y="82" font-size="36" font-weight="bold">20 desks</text><text x="424" y="82" font-size="36" font-weight="bold">2 stations</text><text x="24" y="186" font-size="14">You carry the waste. Custodians collect from shared stations.</text></g><g fill="#687a83"><rect x="26" y="102" width="13" height="18"/><rect x="24" y="98" width="17" height="3"/><rect x="48" y="102" width="13" height="18"/><rect x="46" y="98" width="17" height="3"/><rect x="70" y="102" width="13" height="18"/><rect x="68" y="98" width="17" height="3"/><rect x="92" y="102" width="13" height="18"/><rect x="90" y="98" width="17" height="3"/><rect x="114" y="102" width="13" height="18"/><rect x="112" y="98" width="17" height="3"/><rect x="136" y="102" width="13" height="18"/><rect x="134" y="98" width="17" height="3"/><rect x="158" y="102" width="13" height="18"/><rect x="156" y="98" width="17" height="3"/><rect x="180" y="102" width="13" height="18"/><rect x="178" y="98" width="17" height="3"/><rect x="202" y="102" width="13" height="18"/><rect x="200" y="98" width="17" height="3"/><rect x="224" y="102" width="13" height="18"/><rect x="222" y="98" width="17" height="3"/><rect x="26" y="128" width="13" height="18"/><rect x="24" y="124" width="17" height="3"/><rect x="48" y="128" width="13" height="18"/><rect x="46" y="124" width="17" height="3"/><rect x="70" y="128" width="13" height="18"/><rect x="68" y="124" width="17" height="3