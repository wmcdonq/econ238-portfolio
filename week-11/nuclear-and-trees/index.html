<title id="title">Nuclear Power and New Trees</title><desc id="desc">A proposal for 100 gigawatts of new nuclear power and a forest fund of up to 220 million dollars a year. Calculated nuclear output is 798 terawatt-hours per year. Forest scenario funds about 59,000 hectares in one planting cohort. Construction costs 600 billion to 1 trillion dollars before financing and other costs. Replace solar only when replacement power is ready. Click to read the full proposal.</desc>
<rect width="1100" height="790" fill="#f7f5ee"/><g font-family="Times New Roman,Times,serif" fill="#202b22">
<text x="48" y="47" font-size="18">WALTER MCDONALD · ECON 238 · WEEK ELEVEN</text>
<text x="48" y="108" font-size="52" font-weight="bold">Nuclear Power and New Trees</text>
<text x="48" y="147" font-size="23">Build reactors at suitable sites. Put real funding into forests.</text>
<line x1="48" y1="171" x2="1052" y2="171" stroke="#234737" stroke-width="2"/>
<text x="48" y="221" font-size="27" font-weight="bold">100 GW added by 2050</text>
<text x="48" y="264" font-size="44" font-weight="bold" fill="#234737">798 TWh / year</text>
<text x="48" y="296" font-size="20">At the 2025 nuclear capacity factor of 91.1%.</text>
<text x="48" y="324" font-size="20">About 18% of 2025 U.S. utility-scale generation.</text>
<g stroke="#234737" stroke-width="3" fill="#dbe4da"><path d="M90 450 Q123 407 115 362 L172 362 Q164 407 197 450 Z"/><path d="M209 450 Q242 407 234 362 L291 362 Q283 407 316 450 Z"/><rect x="329" y="400" width="100" height="50"/><path d="M48 452 H471" fill="none"/></g>
<text x="48" y="490" font-size="20">$600 billion-$1 trillion in overnight capital.</text><text x="48" y="516" font-size="18">Older DOE benchmark; financing and other costs extra.</text>
<line x1="545" y1="197" x2="545" y2="537" stroke="#b9c2b6"/>
<text x="584" y="221" font-size="27" font-weight="bold">Up to $220 million / year</text>
<text x="584" y="264" font-size="44" font-weight="bold" fill="#234737">59,000 hectares</text>
<text x="584" y="296" font-size="20">One funded cohort, after a 20% support reserve.</text>
<text x="584" y="324" font-size="20">Assumes $3,000 per hectare. No land purchases.</text>
<g stroke="#234737" stroke-width="3" fill="#c6d7bd"><path d="M624 450 V367 M600 405 L624 365 L650 405 Z M591 433 L624 387 L659 433 Z"/><path d="M720 450 V352 M692 398 L720 352 L748 398 Z M681 431 L720 375 L759 431 Z"/><path d="M818 450 V367 M791 411 L818 367 L845 411 Z M783 435 L818 391 L853 435 Z"/><path d="M920 450 V352 M891 400 L920 352 L949 400 Z M881 433 L920 378 L959 433 Z"/><path d="M584 452 H1037" fill="none"/></g>
<text x="584" y="490" font-size="20">Funding needs congressional approval.</text><text x="584" y="516" font-size="18">Private solar-company research money is not public cash.</text>
<rect x="48" y="555" width="1004" height="101" fill="#e9e1cc"/>
<text x="65" y="586" font-size="23" font-weight="bold">Replacement first.</text>
<text x="65" y="616" font-size="20">Blocking 10 GW of solar for 7 years could add 65 million tons CO2e if gas fills the gap.</text>
<text x="65" y="640" font-size="18">Illustrative life-cycle comparison. Keep useful solar until a better replacement is ready.</text>
<a href="proposal.html"><rect x="48" y="675" width="325" height="54" fill="#234737"/><text x="69" y="710" fill="white" font-size="24">Read full proposal →</text></a>
<text x="395" y="699" font-size="17">Sources: EIA, DOE, NREL, Fargione et al.</text><text x="395" y="723" font-size="17">Scenarios, not forecasts. Full sources and limits in the proposal.</text>
<text x="48" y="767" font-size="16">Nuclear construction has separate financing. Forest benefits require survival, care and time.</text>
